name: Carte du jour surf et wing

on:
  schedule:
    - cron: "30 5 * * *"   # 05h30 UTC = 06h30 (hiver) / 07h30 (été) à Paris
  workflow_dispatch: {}      # lancement manuel possible

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p public && python3 carte_du_jour.py public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
